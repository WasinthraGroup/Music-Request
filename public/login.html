<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | ว.Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'IBM Plex Sans Thai', sans-serif; }</style>
</head>
<body class="bg-[#fdfaf5] flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 bg-white rounded-3xl shadow-xl border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#721c24]">ว.<span>Studio</span></h1>
            <p class="text-gray-500 mt-2 text-sm uppercase tracking-widest">Music Request Login</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Username or Email</label>
                <input id="username" name="username" type="text" required 
                       placeholder="ชื่อผู้ใช้ หรือ อีเมล"
                       class="w-full px-5 py-3 rounded-xl border border-gray-100 bg-gray-50 outline-none focus:ring-2 focus:ring-[#b38b59]/20 transition-all">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Password</label>
                <input type="password" id="password" name="password" required 
                       placeholder="••••••••"
                       class="w-full px-5 py-3 rounded-xl border border-gray-100 bg-gray-50 outline-none focus:ring-2 focus:ring-[#b38b59]/20 transition-all">
            </div>
            <button type="submit" class="w-full bg-[#721c24] text-white py-4 rounded-xl font-bold shadow-lg hover:opacity-90 active:scale-95 transition-all">
                เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
